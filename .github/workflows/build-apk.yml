name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install web dependencies and build React app
        run: |
          npm ci
          npm run lint
          npm run build
          rm -rf app/src/main/assets/www
          mkdir -p app/src/main/assets/www
          cp -r dist/* app/src/main/assets/www/
          rm -rf app/src/main/assets/www/assets/aistudio

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArcMap-10.8-Mobile-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
